services:
  - type: web
    name: voice-kit-phone
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build -w @workhub/voice-kit
    startCommand: npm start -w @voice-kit/phone
    healthCheckPath: /health
    maxShutdownDelaySeconds: 120
    envVars:
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: NODE_VERSION
        value: "22"
  # Ghost Protocol: demo app + receptionist queue. One instance only: tickets live in memory.
  - type: web
    name: ghost-protocol
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build -w @workhub/voice-kit && npm run build -w demo
    startCommand: cd apps/demo && npx next start -p $PORT
    healthCheckPath: /reception
    envVars:
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: RECEPTION_SECRET
        sync: false
      - key: AGENT_ID_GHOST_NAVIGATOR
        sync: false
      - key: NODE_VERSION
        value: "22"
